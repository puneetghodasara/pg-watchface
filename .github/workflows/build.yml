name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the installer's version comes from its last commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Python packages
        run: pip install pillow xmlschema

      - name: Generate watch face
        run: python tools/make_face.py proj

      - name: Validate against the Watch Face Format v2 spec
        run: |
          git clone --depth 1 https://github.com/google/watchface tools/wff-spec
          python tools/validate.py tools/wff-spec/third_party/wff/specification/documents/2/watchface.xsd proj/res/raw/watchface.xml

      - name: Restore signing keys
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          UPDATER_KEYSTORE_B64: ${{ secrets.UPDATER_KEYSTORE_B64 }}
          UPDATER_PROPERTIES: ${{ secrets.UPDATER_PROPERTIES }}
        run: |
          mkdir -p proj/signing updater/signing
          echo "$KEYSTORE_B64" | base64 -d > proj/signing/raincomb.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" > proj/signing/keystore.properties
          echo "$UPDATER_KEYSTORE_B64" | base64 -d > updater/signing/updater.jks
          printf '%s\n' "$UPDATER_PROPERTIES" > updater/signing/updater.properties

      - name: Build and sign watch face
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JAR=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
          BUILD_TOOLS="$BT" ANDROID_JAR="$JAR" bash proj/build.sh
          echo "FACE_VERSION=$(grep -oE 'versionCode="[0-9]+"' proj/build/AndroidManifest.xml | grep -oE '[0-9]+')" >> "$GITHUB_ENV"

      - name: Watch Face Push validation token
        run: bash tools/push_token.sh

      - name: Build installer app
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > updater/local.properties
          # Version = minutes since 1970 of the last commit that changed updater/, so the app on the
          # watch only updates itself when its own code changed (not on every face release).
          INSTALLER_VERSION=$(( $(git log -1 --format=%ct -- updater/) / 60 ))
          echo "INSTALLER_VERSION=$INSTALLER_VERSION" >> "$GITHUB_ENV"
          cd updater && chmod +x gradlew && ./gradlew --no-daemon -q :app:assembleRelease -PversionCode=$INSTALLER_VERSION
          cp app/build/outputs/apk/release/app-release.apk ../proj/dist/PgWatchface-installer.apk
          printf '{"face": %s, "installer": %s}\n' "$FACE_VERSION" "$INSTALLER_VERSION" > ../proj/dist/release.json

      - name: Keep build outputs (branch builds)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: proj/dist/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "face-$FACE_VERSION" \
            proj/dist/RainComb.apk proj/dist/RainComb_token.txt proj/dist/PgWatchface-installer.apk proj/dist/release.json \
            --title "Watch face $FACE_VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Installer app version $INSTALLER_VERSION. The PG Watchface app on the watch installs both automatically."

      - name: Delete old releases (keep the newest 5)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
